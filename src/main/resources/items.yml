# FTopForge - items.yml
# Valores monetarios usados por el calculo de /ftop. Edita y luego /ftopforge reload.
#
# IMPORTANTE: las keys de `Spawners` y `Blocks` deben matchear `EntityType.name()`
# y `Material.name()` en formato UPPER_SNAKE_CASE (ej. IRON_GOLEM, DIAMOND_BLOCK).
# Si pones IronGolem o DiamondBlock se ignoran silenciosamente (devuelven 0).

# --- Apples (single key) ---
GodApple: 5000
GoldenApple: 20

# --- Armor + tools ---
# Key compuesta {metal}_{piece} -> DIAMOND_SWORD, IRON_HELMET, GOLD_PICKAXE, etc.
Diamond:
  Helmet: 250
  ChestPlate: 350
  Leggings: 350
  Boots: 250
  Pickaxe: 300
  Axe: 300
  Sword: 500
  Shovel: 200
  Hoe: 100
Iron:
  Helmet: 200
  ChestPlate: 300
  Leggings: 300
  Boots: 200
  Pickaxe: 200
  Axe: 200
  Sword: 375
  Shovel: 125
  Hoe: 75
Gold:
  Helmet: 125
  ChestPlate: 200
  Leggings: 200
  Boots: 125
  Pickaxe: 100
  Axe: 100
  Sword: 175
  Shovel: 60
  Hoe: 30

# --- Spawners ---
# Tunning baseline paid: spawners endgame (IronGolem, WitherSkeleton, Silverfish) subidos
# para encarecer war factions; mob farms planas baratas; mid-tier (Blaze, Creeper, Enderman) mantenidos.
