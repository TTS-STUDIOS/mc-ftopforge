  BAT: 5000
  BLAZE: 750000
  CAVE_SPIDER: 250000
  CHICKEN: 5000
  COW: 25000
  CREEPER: 600000
  ENDERMAN: 350000
  ENDERMITE: 50000
  GHAST: 500000
  GIANT: 10000
  GUARDIAN: 600000
  HORSE: 50000
  IRON_GOLEM: 2500000
  MAGMA_CUBE: 50000
  MUSHROOM_COW: 100000
  OCELOT: 15000
  PIG: 10000
  PIG_ZOMBIE: 1000000              # 1.8-1.15. En 1.16+ Mojang lo renombro a ZOMBIFIED_PIGLIN.
  ZOMBIFIED_PIGLIN: 1000000        # 1.16+. Mismo valor que PIG_ZOMBIE para mantener parity cross-version.
  RABBIT: 10000
  SHEEP: 10000
  SILVERFISH: 1800000
  SKELETON: 200000
  SLIME: 75000
  SNOWMAN: 10000                   # Snow Golem en 1.16+.
  SPIDER: 100000
  SQUID: 10000
  VILLAGER: 400000
  WITCH: 80000
  WITHER_SKELETON: 1500000         # EntityType propio desde 1.11. En 1.8-1.10 era variant de SKELETON sin entry.
  WOLF: 15000
  ZOMBIE: 150000

# --- Mob drops especiales ---
MobDrops:
  EnderDragonEgg: 15000000

# --- Bloques en claims ---
# Tunning: levantar bloques mid-tier para premiar bases con material caro.
# BEACON cuenta como block (50k flex). Hoppers/dispensers/droppers/spawners-as-block
# se rigen por `forensics.whitelist-blocks` en config.yml para logs (no value).
Blocks:
  DIAMOND_BLOCK: 2500
  EMERALD_BLOCK: 2200
  GOLD_BLOCK: 800
  IRON_BLOCK: 1500
  COAL_BLOCK: 200
  REDSTONE_BLOCK: 400
  LAPIS_BLOCK: 300
  TNT: 25
  OBSIDIAN: 15
  BEACON: 50000
